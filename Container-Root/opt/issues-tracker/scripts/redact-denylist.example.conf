# Site lists for scripts/redact-scan.sh: copy to scripts/redact-denylist.conf (or set REDACT_DENYLIST_FILE) and
# replace the examples. One single-quoted extended-regex alternation per key; the file is read, never sourced.
#   BLOCK_SITE: tokens that must never appear. CUSTOMER_DENYLIST: names that must never appear.
#   REVIEW_SITE and INFRA_DENYLIST: tokens to review; they fail under --strict.
BLOCK_SITE='example-site-token-a|example-site-token-b'
CUSTOMER_DENYLIST='\bexample-customer-a\b|\bexample-customer-b\b'
REVIEW_SITE='example-operator-login|example-reviewer-handle|/opt/example-path-'
INFRA_DENYLIST='example-pod-[01]\b|\bexample-cluster\b'

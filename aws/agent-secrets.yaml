AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  do-agent-aws - one Secrets Manager secret, encrypted with its own KMS key, for the harness's third-party credentials,
  and a read-only IAM policy for the identity the agent container runs as (docs/manual/aws.md "Credentials from AWS Secrets Manager").
  The template creates the secret EMPTY: put the value with put-secret-value, never in a template or a committed file.

Parameters:
  SecretName:
    Type: String
    Default: do-agent-aws/credentials
    AllowedPattern: "^[A-Za-z0-9/_-]{1,200}$"
    Description: Name of the secret (set AGENT_SECRETS_ID to it, or to the SecretArn output); letters, digits, / _ -, as the key alias reuses it.
  ReaderRoleName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9+=,.@_-]{1,64}$"
    Description: >-
      Optional. Name of an existing IAM role the agent container runs as (for example an EC2 instance role) to attach
      the read-only policy to. Leave empty and attach the ReadPolicyArn output to your role yourself.

Conditions:
  AttachToRole: !Not [!Equals [!Ref ReaderRoleName, ""]]

Resources:
  CredentialsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${SecretName} secret (do-agent-aws); usable only through Secrets Manager"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: KeyAdministrationByTheAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:RotateKeyOnDemand
            Resource: "*"
          - Sid: CryptographyOnlyThroughSecretsManager
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
                kms:CallerAccount: !Ref AWS::AccountId
      Tags:
        - Key: Application
          Value: do-agent-aws

  CredentialsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub
        - "alias/${Name}"
        - Name: !Join ["-", !Split ["/", !Ref SecretName]]
      TargetKeyId: !Ref CredentialsKey

  CredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: >-
        do-agent-aws third-party credentials: one JSON object whose keys are the environment variable names the
        harness reads (SLACK_BOT_TOKEN, IMAP_PASSWORD, ...). Created empty; set the value with put-secret-value.
      KmsKeyId: !Ref CredentialsKey
      Tags:
        - Key: Application
          Value: do-agent-aws

  ReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "Read the ${SecretName} secret and decrypt it through Secrets Manager - nothing else"
      Roles: !If [AttachToRole, [!Ref ReaderRoleName], !Ref AWS::NoValue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadTheCredentialsSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Ref CredentialsSecret
            Condition:
              Bool:
                aws:SecureTransport: "true"
          - Sid: DecryptOnlyThroughSecretsManager
            Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt CredentialsKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"

Outputs:
  SecretArn:
    Description: Set AGENT_SECRETS_ID to this ARN (or to the secret name).
    Value: !Ref CredentialsSecret
  KeyArn:
    Value: !GetAtt CredentialsKey.Arn
  ReadPolicyArn:
    Description: Attach to the role the agent container runs as, if ReaderRoleName was left empty.
    Value: !Ref ReadPolicy
